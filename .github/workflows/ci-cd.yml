name: CI e publicação de imagens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  BACKEND_IMAGE: ghcr.io/gabriellourenco1912/inat-back
  FRONTEND_IMAGE: ghcr.io/gabriellourenco1912/inat-front
  BACKUP_IMAGE: ghcr.io/gabriellourenco1912/inat-mysql-backup
  NEXT_TELEMETRY_DISABLED: "1"

# Configure no repositório principal:
# - SUBMODULES_TOKEN: secret com um PAT com leitura do repositório principal e
# dos submódulos backend-inat, frontend-inat e mobile-inat. Para um PAT
# fine-grained, selecione esses repositórios e a permissão Contents: read.
# O PAT é usado apenas no checkout dos submódulos. O push no GHCR usa o
# GITHUB_TOKEN temporário do job, com packages: write.
# Os pacotes devem estar vinculados a este repositório ou conceder acesso a ele
# em Manage Actions access.
# - NEXT_PUBLIC_INTERNAL_SYSTEM_URL (opcional): variável usada no build do Next.js.

jobs:
  backend:
    name: Backend · Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout dos commits dos submódulos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Configurar Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testes e pacote
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_INTERNAL_SYSTEM_URL: ${{ vars.NEXT_PUBLIC_INTERNAL_SYSTEM_URL }}
    steps:
      - name: Checkout dos commits dos submódulos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build e verificação de TypeScript
        run: npm run build

  mysql-backup:
    name: MySQL · Backup e restauração
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout dos scripts de infraestrutura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validar backup e restauração em MySQL descartável
        run: bash docker/mysql-backup/tests/integration.sh

  images:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [backend, frontend, mysql-backup]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout dos commits dos submódulos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Autenticar no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publicar backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Publicar frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_PUBLIC_INTERNAL_SYSTEM_URL=${{ vars.NEXT_PUBLIC_INTERNAL_SYSTEM_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Publicar backup MySQL
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/mysql-backup
          file: docker/mysql-backup/Dockerfile
          push: true
          tags: |
            ${{ env.BACKUP_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKUP_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mysql-backup
          cache-to: type=gha,scope=mysql-backup,mode=max
