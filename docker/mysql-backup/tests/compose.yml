# Used only by integration.sh, with a unique project and throwaway storage.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_BACKUP_TEST_ROOT_PASSWORD:?}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: app_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --no-defaults --protocol=TCP --host=127.0.0.1 --user=root --execute="SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  mysql-backup:
    image: ${MYSQL_BACKUP_TEST_IMAGE:?}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_BACKUP_DATABASE: app_test
      MYSQL_BACKUP_HOST: mysql
      MYSQL_BACKUP_PORT: 3306
      MYSQL_BACKUP_USERNAME: backup_reader
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_TEST_PASSWORD:?}
      MYSQL_BACKUP_RETENTION_DAYS: 30
      MYSQL_RESTORE_USERNAME: root
      MYSQL_RESTORE_PASSWORD: ${MYSQL_BACKUP_TEST_ROOT_PASSWORD:?}
    volumes:
      - ${MYSQL_BACKUP_TEST_DATA_DIR:?}:/backups
      - /etc/localtime:/etc/localtime:ro
      # Exercise real cron each minute; production crontab is checked separately.
      - ${MYSQL_BACKUP_TEST_CRONTAB:?}:/etc/cron.d/mysql-backup:ro
    tmpfs:
      - /tmp:mode=0700
      - /run:mode=0755
    healthcheck:
      test: [CMD-SHELL, 'test -s /run/crond.pid && kill -0 $$(cat /run/crond.pid)']
      interval: 2s
      timeout: 3s
      retries: 10
