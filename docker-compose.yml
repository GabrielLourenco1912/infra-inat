services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_NAME:-inat_ead}
      MYSQL_USER: ${DB_USERNAME:-inat_ead}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --execute=\"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      API_SECURITY_JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      API_SECURITY_JWT_ISSUER: ${JWT_ISSUER:?Defina JWT_ISSUER no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS no arquivo .env}
      API_SECURITY_REFRESH_COOKIE_SECURE: ${API_SECURITY_REFRESH_COOKIE_SECURE:-true}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-inat_ead}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-inat_ead}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      EMAIL: ${EMAIL:?Defina EMAIL no arquivo .env}
      EMAIL_PASS: ${EMAIL_PASS:?Defina EMAIL_PASS no arquivo .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_CONNECTION_TIMEOUT: ${SMTP_CONNECTION_TIMEOUT:-5000}
      SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-5000}
      SMTP_WRITE_TIMEOUT: ${SMTP_WRITE_TIMEOUT:-5000}
      AUTH_CHALLENGE_TTL: ${AUTH_CHALLENGE_TTL:-10m}
      AUTH_CHALLENGE_MAX_ATTEMPTS: ${AUTH_CHALLENGE_MAX_ATTEMPTS:-5}
      AUTH_ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS: ${AUTH_ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS:-5}
      AUTH_ACCOUNT_LOCK_DURATION: ${AUTH_ACCOUNT_LOCK_DURATION:-15m}
      AUTH_ACCOUNT_LOCK_SCHEDULER_ENABLED: ${AUTH_ACCOUNT_LOCK_SCHEDULER_ENABLED:-true}
      AUTH_ACCOUNT_UNLOCK_INTERVAL: ${AUTH_ACCOUNT_UNLOCK_INTERVAL:-60000}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-true}
      NOTIFICATION_EMAIL_DISPATCH_DELAY: ${NOTIFICATION_EMAIL_DISPATCH_DELAY:-5000}
      NOTIFICATION_EMAIL_BATCH_SIZE: ${NOTIFICATION_EMAIL_BATCH_SIZE:-50}
      ACADEMIC_LIFECYCLE_ENABLED: ${ACADEMIC_LIFECYCLE_ENABLED:-true}
      ACADEMIC_LIFECYCLE_INTERVAL: ${ACADEMIC_LIFECYCLE_INTERVAL:-60000}
      ACADEMIC_REMINDER_BATCH_SIZE: ${ACADEMIC_REMINDER_BATCH_SIZE:-200}
      ACADEMIC_ATTENDANCE_BATCH_SIZE: ${ACADEMIC_ATTENDANCE_BATCH_SIZE:-200}
      DOCUMENT_LIFECYCLE_ENABLED: ${DOCUMENT_LIFECYCLE_ENABLED:-true}
      DOCUMENT_LIFECYCLE_INTERVAL: ${DOCUMENT_LIFECYCLE_INTERVAL:-60000}
      DOCUMENT_LIFECYCLE_BATCH_SIZE: ${DOCUMENT_LIFECYCLE_BATCH_SIZE:-200}
      FILE_STORAGE_ROOT: /var/lib/inat/files
      FILE_STORAGE_MAX_SIZE: ${FILE_STORAGE_MAX_SIZE:-25MB}
      FILE_STORAGE_MAX_REQUEST_SIZE: ${FILE_STORAGE_MAX_REQUEST_SIZE:-26MB}
      FILE_ALLOWED_DOCUMENT_EXTENSIONS: ${FILE_ALLOWED_DOCUMENT_EXTENSIONS:-pdf,png,jpg,jpeg,webp}
      FILE_ALLOWED_ACTIVITY_EXTENSIONS: ${FILE_ALLOWED_ACTIVITY_EXTENSIONS:-pdf,png,jpg,jpeg,webp,gif,txt,csv,rtf,docx,xlsx,pptx,odt,ods,odp,mp3,mp4,webm,wav}
      FILE_ALLOWED_SUBMISSION_EXTENSIONS: ${FILE_ALLOWED_SUBMISSION_EXTENSIONS:-pdf,png,jpg,jpeg,webp,gif,txt,csv,rtf,docx,xlsx,pptx,odt,ods,odp,mp3,mp4,webm,wav}
      FILE_ANTIVIRUS_ENABLED: ${FILE_ANTIVIRUS_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_CONNECT_TIMEOUT: ${CLAMAV_CONNECT_TIMEOUT:-3s}
      CLAMAV_READ_TIMEOUT: ${CLAMAV_READ_TIMEOUT:-30s}
    volumes:
      - file_storage:/var/lib/inat/files

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        NEXT_PUBLIC_INTERNAL_SYSTEM_URL: ${NEXT_PUBLIC_INTERNAL_SYSTEM_URL:-}
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:8080}
      REGULATION_URL: ${REGULATION_URL:-}
      FRONTEND_AUTH_COOKIE_SECURE: ${FRONTEND_AUTH_COOKIE_SECURE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
  file_storage:
